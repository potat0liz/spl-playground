<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A browser-based Splunk SPL interpreter with generated sample data, a command reference and graded exercises.">
<title>SPL Playground - practise Splunk searches without Splunk</title>
<style>
/* =========================================================================
   SPL Playground - styles
   ========================================================================= */

/* Neutrals carry a slight green bias so they sit with the accent rather than
   reading as default grey. Semantic colours (ok/warn/bad) are deliberately
   separate from the accent, since the accent means "the app", not "healthy". */
:root {
  --bg: #f4f6f5;
  --panel: #ffffff;
  --panel-2: #fafbfa;
  --border: #d7dedb;
  --border-soft: #e6ebe9;
  --text: #191f1d;
  --text-dim: #59635f;
  --text-faint: #86918c;
  --accent: #159c6f;
  --accent-2: #0a7f59;
  --accent-soft: #e6f5ef;
  --blue: #2b6cb0;
  --amber: #b7791f;
  --red: #c53030;
  --purple: #6b46c1;
  --code-bg: #f1f4f3;
  --ok: #147a52;
  --warn: #9a6b12;
  --bad: #b3382f;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 8px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141817;
    --panel: #1b201e;
    --panel-2: #212724;
    --border: #333c38;
    --border-soft: #29302d;
    --text: #e5eae7;
    --text-dim: #a2aca7;
    --text-faint: #727d78;
    --accent: #2fbd8a;
    --accent-2: #3fd39c;
    --accent-soft: #16342a;
    --blue: #7aa9e0;
    --amber: #e0b062;
    --red: #f08a8a;
    --purple: #b19cf0;
    --code-bg: #232a27;
    --ok: #4cc48c;
    --warn: #d9a94e;
    --bad: #ef8b83;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #141817; --panel: #1b201e; --panel-2: #212724; --border: #333c38;
  --border-soft: #29302d; --text: #e5eae7; --text-dim: #a2aca7; --text-faint: #727d78;
  --accent: #2fbd8a; --accent-2: #3fd39c; --accent-soft: #16342a; --blue: #7aa9e0;
  --amber: #e0b062; --red: #f08a8a; --purple: #b19cf0; --code-bg: #232a27;
  --ok: #4cc48c; --warn: #d9a94e; --bad: #ef8b83;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f6f5; --panel: #ffffff; --panel-2: #fafbfa; --border: #d7dedb;
  --border-soft: #e6ebe9; --text: #191f1d; --text-dim: #59635f; --text-faint: #86918c;
  --accent: #159c6f; --accent-2: #0a7f59; --accent-soft: #e6f5ef; --blue: #2b6cb0;
  --amber: #b7791f; --red: #c53030; --purple: #6b46c1; --code-bg: #f1f4f3;
  --ok: #147a52; --warn: #9a6b12; --bad: #b3382f;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08); color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------- layout ---------- */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 650; letter-spacing: -.01em; }
.brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }
.brand small { font-weight: 400; color: var(--text-faint); font-size: 12px; }
.topbar .spacer { flex: 1; }

.iconbtn {
  background: transparent; border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; color: var(--text-dim); white-space: nowrap;
}
.iconbtn:hover { background: var(--panel-2); color: var(--text); }
.iconbtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); }

.main { flex: 1; display: flex; min-height: 0; }
/* min-height:0 is required or the column flex child refuses to shrink and the
   results pane overflows the viewport instead of scrolling internally. */
.left { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.right {
  width: 420px; flex-shrink: 0; border-left: 1px solid var(--border);
  background: var(--panel); display: flex; flex-direction: column; min-height: 0;
}
.right.hidden { display: none; }

/* ---------- search bar ---------- */
.searchzone { padding: 12px 14px 10px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.searchrow { display: flex; gap: 8px; align-items: stretch; }
.spl-wrap { flex: 1; position: relative; }
.spl {
  width: 100%; min-height: 68px; max-height: 220px; resize: vertical;
  padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--code-bg); font-family: var(--mono); font-size: 13px; line-height: 1.55;
  outline: none; white-space: pre-wrap;
}
.spl:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.searchside { display: flex; flex-direction: column; gap: 6px; width: 172px; flex-shrink: 0; }
select.time {
  padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel-2); cursor: pointer;
}
.run {
  padding: 9px 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  border-radius: var(--radius); font-weight: 600; cursor: pointer; flex: 1;
}
.run:hover { background: var(--accent-2); border-color: var(--accent-2); }
.run:active { transform: translateY(1px); }
.hintline { margin-top: 6px; font-size: 12px; color: var(--text-faint); display: flex; gap: 14px; flex-wrap: wrap; }
.hintline kbd {
  font-family: var(--mono); font-size: 11px; background: var(--code-bg);
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px;
}

/* ---------- status ---------- */
.status { padding: 8px 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
          border-bottom: 1px solid var(--border-soft); font-size: 13px; color: var(--text-dim); flex-shrink: 0; }
.status { font-variant-numeric: tabular-nums; }
.status b { color: var(--text); font-variant-numeric: tabular-nums; }
.errbox {
  margin: 10px 14px; padding: 10px 12px; border-radius: var(--radius);
  background: color-mix(in srgb, var(--red) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 40%, transparent);
  color: var(--red); font-size: 13px;
}
.errbox code { font-family: var(--mono); }
.warnbox {
  margin: 10px 14px; padding: 8px 12px; border-radius: var(--radius);
  background: color-mix(in srgb, var(--amber) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
  color: var(--amber); font-size: 12.5px;
}

/* ---------- results area ---------- */
.results { flex: 1; display: flex; min-height: 0; }
.sidebar {
  width: 220px; flex-shrink: 0; border-right: 1px solid var(--border-soft);
  overflow-y: auto; padding: 10px 0; background: var(--panel-2);
}
.sidebar h4 { margin: 6px 12px 4px; font-size: 11px; text-transform: uppercase;
              letter-spacing: .07em; color: var(--text-faint); font-weight: 600; }
.fielditem { padding: 4px 12px; cursor: pointer; display: flex; justify-content: space-between;
             gap: 8px; font-size: 12.5px; }
.fielditem:hover { background: var(--accent-soft); }
.fielditem .fname { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fielditem .fcount { color: var(--text-faint); font-variant-numeric: tabular-nums; flex-shrink: 0; }

.pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--border-soft); flex-shrink: 0; }
.tab {
  padding: 8px 12px; cursor: pointer; border: none; background: transparent;
  color: var(--text-dim); border-bottom: 2px solid transparent; font-size: 13px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent-2); border-bottom-color: var(--accent); font-weight: 600; }
.tab .badge { font-size: 11px; color: var(--text-faint); margin-left: 4px; }
.tabbody { flex: 1; overflow: auto; }

/* ---------- timeline ---------- */
.timeline { padding: 8px 14px 4px; border-bottom: 1px solid var(--border-soft); flex-shrink: 0; }
.timeline svg { display: block; width: 100%; height: 62px; }
.timeline .tl-label { font-size: 10px; fill: var(--text-faint); }

/* ---------- tables ---------- */
table.res { border-collapse: collapse; width: 100%; font-size: 13px; }
table.res th {
  position: sticky; top: 0; z-index: 1; background: var(--panel-2);
  text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 12px; color: var(--text-dim); white-space: nowrap;
}
table.res td { padding: 6px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
table.res tbody tr:hover { background: var(--panel-2); }
table.res td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12.5px; }
table.res td.mono { font-family: var(--mono); font-size: 12.5px; }
table.res td .mv { display: block; }
table.res td .mv + .mv { border-top: 1px dotted var(--border); }
.nullv { color: var(--text-faint); font-style: italic; }

/* State reads at a glance: a 4xx is a different kind of thing from a 200,
   and an ERROR is a different kind of thing from an INFO. */
.pill {
  display: inline-block; font-family: var(--mono); font-size: 11.5px; font-weight: 600;
  padding: 1px 7px; border-radius: 999px; letter-spacing: .01em;
  border: 1px solid currentColor; line-height: 1.5;
}
.pill.ok   { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.pill.bad  { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.pill.neutral { color: var(--text-dim); background: var(--code-bg); border-color: var(--border); }

/* ---------- events ---------- */
.evt { padding: 9px 14px; border-bottom: 1px solid var(--border-soft); }
.evt .evt-time { font-size: 11.5px; color: var(--text-faint); font-family: var(--mono); margin-bottom: 3px; }
.evt .evt-raw { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
.evt .evt-fields { margin-top: 5px; font-size: 11.5px; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.evt .evt-fields span b { color: var(--blue); font-weight: 500; font-family: var(--mono); }
.evt .evt-fields span i { font-style: normal; font-family: var(--mono); }
.hl { background: color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 2px; }

.empty { padding: 40px 20px; text-align: center; color: var(--text-faint); }
.empty h3 { margin: 0 0 6px; color: var(--text-dim); font-size: 15px; font-weight: 600; }

/* ---------- viz ---------- */
.viz { padding: 14px; }
.viz svg { display: block; width: 100%; }
.viz .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--text-dim); }
.viz .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; }
.vizpick { display: flex; gap: 6px; margin-bottom: 10px; }
.vizpick button { padding: 4px 10px; font-size: 12px; border: 1px solid var(--border);
                  background: var(--panel); border-radius: 6px; cursor: pointer; color: var(--text-dim); }
.vizpick button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); }

/* ---------- right panel ---------- */
.rtabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.rtab { flex: 1; padding: 9px 4px; text-align: center; cursor: pointer; border: none;
        background: transparent; color: var(--text-dim); font-size: 12.5px; border-bottom: 2px solid transparent; }
.rtab.active { color: var(--accent-2); border-bottom-color: var(--accent); font-weight: 600; }
.rbody { flex: 1; overflow-y: auto; padding: 12px 14px; }
.rsearch { width: 100%; padding: 7px 10px; border: 1px solid var(--border);
           border-radius: 6px; background: var(--panel-2); margin-bottom: 10px; }

.cmd { border: 1px solid var(--border-soft); border-radius: var(--radius); margin-bottom: 8px; background: var(--panel-2); }
.cmd summary { padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; }
.cmd summary::-webkit-details-marker { display: none; }
.cmd summary::before { content: "▸"; color: var(--text-faint); font-size: 11px; transition: transform .12s; }
.cmd[open] summary::before { transform: rotate(90deg); }
.cmd .cname { font-family: var(--mono); font-weight: 600; color: var(--accent-2); }
.cmd .cgroup { margin-left: auto; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
               color: var(--text-faint); }
.cmd .star { color: var(--amber); font-size: 11px; }
.cmd .cbody { padding: 0 10px 10px; font-size: 12.5px; color: var(--text-dim); }
.cmd .csyntax { font-family: var(--mono); font-size: 12px; background: var(--code-bg);
                padding: 6px 8px; border-radius: 5px; margin: 0 0 8px; color: var(--text);
                overflow-x: auto; white-space: pre; }
.cmd .cex { font-family: var(--mono); font-size: 12px; background: var(--code-bg); color: var(--text);
            padding: 6px 8px; border-radius: 5px; margin-top: 5px; cursor: pointer;
            border: 1px solid transparent; word-break: break-word; }
.cmd .cex:hover { border-color: var(--accent); }

.slist { list-style: none; margin: 0 0 14px; padding: 0; }
.slist li { padding: 7px 9px; border: 1px solid var(--border-soft); border-radius: 6px;
            margin-bottom: 5px; cursor: pointer; background: var(--panel-2); }
.slist li:hover { border-color: var(--accent); }
.slist .st { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
.slist .sq { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); word-break: break-word; }
.gh { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
      color: var(--text-faint); font-weight: 600; margin: 14px 0 6px; }
.gh:first-child { margin-top: 0; }

/* ---------- exercises ---------- */
.exhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.exhead .score { font-size: 12px; color: var(--text-dim); }
.progressbar { height: 5px; background: var(--border-soft); border-radius: 3px; overflow: hidden; flex: 1; }
.progressbar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

.ex { border: 1px solid var(--border-soft); border-radius: var(--radius); margin-bottom: 8px; background: var(--panel-2); }
.ex.done { border-color: var(--accent); }
.ex summary { padding: 9px 10px; cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: flex-start; }
.ex summary::-webkit-details-marker { display: none; }
.ex .exmark { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border);
              flex-shrink: 0; margin-top: 2px; font-size: 11px; line-height: 13px; text-align: center; }
.ex.done .exmark { background: var(--accent); border-color: var(--accent); color: #fff; }
.ex .exq { font-size: 12.5px; }
.ex .exlvl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); }
.ex .exbody { padding: 0 10px 10px; }
.ex .exbtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.ex .exbtns button { padding: 4px 9px; font-size: 12px; border: 1px solid var(--border);
                     background: var(--panel); border-radius: 6px; cursor: pointer; color: var(--text-dim); }
.ex .exbtns button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.ex .exmsg { margin-top: 8px; font-size: 12.5px; padding: 7px 9px; border-radius: 6px; }
.ex .exmsg.ok { background: var(--accent-soft); color: var(--accent-2); }
.ex .exmsg.bad { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.ex .exmsg.info { background: var(--code-bg); color: var(--text-dim); }
.ex .exsol { font-family: var(--mono); font-size: 11.5px; background: var(--code-bg);
             padding: 6px 8px; border-radius: 5px; margin-top: 6px; word-break: break-word; }

.note { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin-bottom: 14px; }
.note h5 { margin: 0 0 3px; font-size: 12.5px; }
.note p { margin: 0; font-size: 12.5px; color: var(--text-dim); }

.ref-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 14px; }
.ref-table td { padding: 5px 6px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
.ref-table td:first-child { font-family: var(--mono); color: var(--accent-2); white-space: nowrap; width: 40%; }
.ref-table .exline { display: block; font-family: var(--mono); color: var(--text-faint);
                     margin-top: 3px; cursor: pointer; font-size: 11.5px; }
.ref-table .exline:hover { color: var(--accent-2); }

.datasets { font-size: 12.5px; }
.datasets table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.datasets th, .datasets td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border-soft); }
.datasets th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); }
.datasets code { font-family: var(--mono); font-size: 11.5px; background: var(--code-bg);
                 padding: 1px 4px; border-radius: 3px; }

/* ---------- field value popover ---------- */
.fvpop {
  position: absolute; z-index: 50; background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 10px 12px;
  width: 300px; max-height: 360px; overflow-y: auto; font-size: 12.5px;
}
.fvpop h5 { margin: 0 0 8px; font-family: var(--mono); font-size: 12.5px; }
.fvpop table { width: 100%; border-collapse: collapse; }
.fvpop td { padding: 3px 4px; border-bottom: 1px solid var(--border-soft); }
.fvpop td:first-child { font-family: var(--mono); word-break: break-all; cursor: pointer; }
.fvpop td:first-child:hover { color: var(--accent-2); }
.fvpop td:last-child { text-align: right; color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fvpop .bar { height: 3px; background: var(--accent); border-radius: 2px; margin-top: 2px; }
.fvpop .close { float: right; cursor: pointer; color: var(--text-faint); }

/* Keyboard users need to see where they are. */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
.spl:focus-visible { outline: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .run:active { transform: none; }
}

@media (max-width: 1100px) {
  .right { width: 340px; }
  .sidebar { display: none; }
}
/* On small screens stop pinning to the viewport: let the whole document scroll,
   which is what phones expect, and give each region its natural height. */
@media (max-width: 820px) {
  .app { height: auto; min-height: 100vh; overflow: visible; }
  .main { flex-direction: column; }
  .left, .pane, .results { min-height: 0; }
  .right {
    width: 100%; border-left: none; border-top: 1px solid var(--border);
    max-height: none; flex-shrink: 0;
  }
  .tabbody { overflow-x: auto; overflow-y: visible; }
  .rbody { overflow: visible; }
  .searchside { width: 130px; }
  table.res th { position: static; }
}

</style>
<script>
/* ===== data.js ===== */
/* =========================================================================
   SPL Playground - Mock data generator
   Deterministic (seeded) so that every user sees identical results and
   challenge answers stay stable.
   ========================================================================= */
(function (global) {
  'use strict';

  /* ---------- seeded PRNG (mulberry32) ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var rnd = mulberry32(20260811);
  function rand() { return rnd(); }
  function ri(min, max) { return Math.floor(rand() * (max - min + 1)) + min; }
  function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
  function weighted(pairs) {
    var total = 0, i;
    for (i = 0; i < pairs.length; i++) total += pairs[i][1];
    var r = rand() * total;
    for (i = 0; i < pairs.length; i++) { r -= pairs[i][1]; if (r <= 0) return pairs[i][0]; }
    return pairs[pairs.length - 1][0];
  }

  /* ---------- reference tables ---------- */

      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' +0000';

    return curve[hour];
  }

  /* Produce N timestamps spread over [start,end] with a diurnal shape. */
  function makeTimes(n, start, end) {
    var out = [], i;
    for (i = 0; i < n; i++) {
      var t, guard = 0;
      do {
        t = start + rand() * (end - start);
        guard++;
      } while (guard < 6 && rand() > timeWeight(new Date(t * 1000).getHours()) / 2.2);
      out.push(t);
    }
    out.sort(function (a, b) { return a - b; });
    return out;
  }

    if (v === '@w0') return { earliest: L.relativeTime(now, '@w0'), latest: now };
    return { earliest: L.relativeTime(now, v), latest: now };
  }

  /* =====================================================================
     Search execution
     ===================================================================== */
  function currentQuery() { return $('#spl').value.trim(); }

  function runSearch() {
    var q = currentQuery();
    if (!q) { STATE.result = null; STATE.error = null; render(); return; }
    var b = rangeBounds(STATE.range);
    save('lastQuery', q); save('lastRange', STATE.range);
    try {
      STATE.result = E.runSearch(q, {
        events: DATA.events, lookups: DATA.lookups, geoBlocks: DATA.geoBlocks,
        macros: C.MACROS, earliest: b.earliest, latest: b.latest,
        knownIndexes: DATA.indexes
      });
      STATE.error = null;
      if (STATE.result.isEvents) STATE.tab = 'events';
      else if (STATE.tab === 'events') STATE.tab = 'stats';
    } catch (e) {
      STATE.result = null;
      STATE.error = e && e.message ? e.message : String(e);
    }
    STATE.popField = null;
    render();
  }

  function setQuery(q, run) {
    $('#spl').value = q;
    if (run !== false) runSearch();
    $('#spl').focus();
  }

  /* =====================================================================
     Rendering
     ===================================================================== */
  function render() {
    renderStatus();
    renderSidebar();
    renderTabs();
    renderBody();
  }

  function renderStatus() {
    var box = clear($('#status'));
    var r = STATE.result;
    if (STATE.error) {
      $('#errzone').innerHTML = '';
      $('#errzone').appendChild(el('div', { class: 'errbox' }, [
        el('strong', { text: 'Search error: ' }), STATE.error
      ]));
      box.appendChild(el('span', { text: 'No results' }));
      return;
    }
    $('#errzone').innerHTML = '';
    if (!r) { box.appendChild(el('span', { text: 'Enter a search and press Run.' })); return; }

    var n = r.rows.length;
    box.appendChild(el('span', {}, [el('b', { text: fmtInt(n) }), ' ' + (r.isEvents ? (n === 1 ? 'event' : 'events') : (n === 1 ? 'result' : 'results'))]));
    box.appendChild(el('span', {}, ['in ', el('b', { text: r.elapsed.toFixed(1) + ' ms' })]));
    var b = rangeBounds(STATE.range);
    var e0 = r.earliest !== undefined && r.earliest !== null ? r.earliest : b.earliest;
    var l0 = r.latest !== undefined && r.latest !== null ? r.latest : b.latest;
    if (e0) box.appendChild(el('span', { text: L.strftime(e0, '%b %d %H:%M') + '  →  ' + (l0 ? L.strftime(l0, '%b %d %H:%M') : 'now') }));
    else box.appendChild(el('span', { text: 'all time' }));

    if (r.warnings && r.warnings.length) {
      var w = el('div', { class: 'warnbox' });
      r.warnings.forEach(function (x) { w.appendChild(el('div', { text: x })); });
      $('#errzone').appendChild(w);
    }
  }

  function renderSidebar() {
    var sb = clear($('#sidebar'));
    var r = STATE.result;
    if (!r || !r.rows.length) return;
    var sample = r.rows.slice(0, 1500);
    var stats = {};
    sample.forEach(function (row) {
      Object.keys(row).forEach(function (k) {
        if (k === '_raw' || k === '_cd' || k === 'punct') return;
        if (!stats[k]) stats[k] = { n: 0, vals: {} };
        stats[k].n++;
        var v = row[k];
        (Array.isArray(v) ? v : [v]).forEach(function (x) {
          var s = L.toStr(x);
          if (s === '') return;
          stats[k].vals[s] = (stats[k].vals[s] || 0) + 1;
        });
      });
    });
    var names = Object.keys(stats).sort(function (a, b) {
      if ((a[0] === '_') !== (b[0] === '_')) return a[0] === '_' ? 1 : -1;
      return a.localeCompare(b);
    });
    sb.appendChild(el('h4', { text: names.length + ' fields' }));
    names.forEach(function (k) {
      var dc = Object.keys(stats[k].vals).length;
      sb.appendChild(el('div', {
        class: 'fielditem',
        onclick: function (ev) { showFieldPop(ev.currentTarget, k, stats[k]); }
      }, [
        el('span', { class: 'fname', text: k, title: k }),
        el('span', { class: 'fcount', text: dc })
      ]));
    });
  }

  function showFieldPop(anchor, name, st) {
    var old = $('#fvpop'); if (old) old.remove();
    var entries = Object.keys(st.vals).map(function (v) { return { v: v, n: st.vals[v] }; });
    entries.sort(function (a, b) { return b.n - a.n; });
    var total = entries.reduce(function (s, e) { return s + e.n; }, 0);
    var top = entries.slice(0, 10);
    var tbl = el('table');
    top.forEach(function (e) {
      var pct = total ? (e.n / total * 100) : 0;
      tbl.appendChild(el('tr', {}, [
        el('td', { onclick: function () { appendFilter(name, e.v); } }, [
          document.createTextNode(e.v.length > 42 ? e.v.slice(0, 42) + '…' : e.v),
          el('div', { class: 'bar', style: 'width:' + Math.max(2, pct) + '%' })
        ]),
        el('td', { text: fmtInt(e.n) + '  ' + pct.toFixed(1) + '%' })
      ]));
    });
    var pop = el('div', { class: 'fvpop', id: 'fvpop' }, [
      el('span', { class: 'close', text: '×', onclick: function () { pop.remove(); } }),
      el('h5', { text: name }),
      el('div', { style: 'font-size:11.5px;color:var(--text-faint);margin-bottom:6px',
                  text: entries.length + ' distinct value' + (entries.length === 1 ? '' : 's') + ' in ' + fmtInt(st.n) + ' rows' }),
      tbl,
      el('div', { style: 'margin-top:8px;display:flex;gap:6px;flex-wrap:wrap' }, [
        el('button', { class: 'iconbtn', text: 'top ' + name,
          onclick: function () { setQuery(currentQuery() + ' | top ' + name); pop.remove(); } }),
        el('button', { class: 'iconbtn', text: 'stats count by ' + name,
          onclick: function () { setQuery(currentQuery() + ' | stats count by ' + name); pop.remove(); } })
      ])
    ]);
    document.body.appendChild(pop);
    var r = anchor.getBoundingClientRect();
    pop.style.left = Math.min(r.right + 8, window.innerWidth - 320) + 'px';
    pop.style.top = Math.min(r.top, window.innerHeight - 380) + 'px';
    setTimeout(function () {
      document.addEventListener('click', function h(ev) {
        if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('click', h); }
      });
    }, 0);
  }

  function appendFilter(name, value) {
    var q = currentQuery();
    var needsQuote = /[\s"]/.test(value);
    var term = name + '=' + (needsQuote ? '"' + value.replace(/"/g, '\\"') + '"' : value);
    var segs = q.split('|');
    segs[0] = segs[0].trim() + ' ' + term + ' ';
    setQuery(segs.join('|').replace(/\s+\|/g, ' |'));
    var pop = $('#fvpop'); if (pop) pop.remove();
  }

  function renderTabs() {
    var t = clear($('#tabs'));
    var r = STATE.result;
    if (!r) return;
    var defs = [];
    if (r.isEvents) defs.push({ k: 'events', l: 'Events', b: fmtInt(r.rows.length) });
    defs.push({ k: 'stats', l: r.isEvents ? 'Table' : 'Statistics', b: fmtInt(r.rows.length) });
    defs.push({ k: 'viz', l: 'Visualization' });
    if (!r.isEvents && STATE.tab === 'events') STATE.tab = 'stats';
    defs.forEach(function (d) {
      t.appendChild(el('button', {
        class: 'tab' + (STATE.tab === d.k ? ' active' : ''),
        onclick: function () { STATE.tab = d.k; renderTabs(); renderBody(); }
      }, [d.l, d.b ? el('span', { class: 'badge', text: d.b }) : null]));
    });
  }

  function renderBody() {
    var body = clear($('#tabbody'));
    var tl = clear($('#timeline'));
    var r = STATE.result;
    if (STATE.error) { return; }
    if (!r) {
      body.appendChild(el('div', { class: 'empty' }, [
        el('h3', { text: 'Nothing searched yet' }),
        el('div', { text: 'Try one of the sample searches on the right, or start with:' }),
        el('div', { style: 'margin-top:10px;font-family:var(--mono);font-size:13px' }, [
          el('a', { href: '#', style: 'color:var(--accent-2)', text: 'index=web | stats count by status',
            onclick: function (e) { e.preventDefault(); setQuery('index=web | stats count by status'); } })
        ])
      ]));
      return;
    }
    if (!r.rows.length) {
      body.appendChild(el('div', { class: 'empty' }, [
        el('h3', { text: 'No results found' }),
        el('div', { text: 'Widen the time range, check field name spelling (they are case sensitive), or remove a filter.' })
      ]));
      return;
    }
    if (r.isEvents) drawTimeline(tl, r.rows);
    if (STATE.tab === 'events') renderEvents(body, r);
    else if (STATE.tab === 'stats') renderTable(body, r);
    else renderViz(body, r);
  }

  /* ---------- events ---------- */
  function renderEvents(body, r) {
    // narrow screens scroll the whole document, so a 200-event page gets absurdly long
    var limit = window.innerWidth <= 820 ? 50 : 200;
    var rows = r.rows.slice(0, limit);
    var terms = highlightTerms(currentQuery());
    rows.forEach(function (ev) {
      var fields = Object.keys(ev).filter(function (k) {
        return k.charAt(0) !== '_' && k !== 'punct' && k !== 'linecount' && !Array.isArray(ev[k]);
      }).slice(0, 14);
      body.appendChild(el('div', { class: 'evt' }, [
        el('div', { class: 'evt-time', text: ev._time !== undefined ? L.strftime(ev._time, '%d/%m/%Y %H:%M:%S.%N') : '' }),
        el('div', { class: 'evt-raw', html: highlight(L.toStr(ev._raw !== undefined ? ev._raw : JSON.stringify(ev)), terms) }),
        el('div', { class: 'evt-fields' }, fields.map(function (k) {
          return el('span', {}, [el('b', { text: k }), document.createTextNode(' = '), el('i', { text: L.toStr(ev[k]) })]);
        }))
      ]));
    });
    if (r.rows.length > limit) {
      body.appendChild(el('div', { class: 'empty', style: 'padding:16px',
        text: 'Showing the first ' + limit + ' of ' + fmtInt(r.rows.length) + ' events. Add a filter or pipe to stats to summarise them.' }));
    }
  }

  function highlightTerms(q) {
    var base = q.split('|')[0];
    var out = [];
    (base.match(/"[^"]*"|[^\s()]+/g) || []).forEach(function (t) {
      t = t.replace(/^"|"$/g, '');
      if (/^(AND|OR|NOT|IN|search)$/i.test(t)) return;
      var m = /^([A-Za-z_][A-Za-z0-9_.]*)\s*(!=|>=|<=|=|<|>)\s*([\s\S]*)$/.exec(t);
      // metadata fields are not part of the raw text, so highlighting them
      // just paints unrelated substrings (index=web matching "AppleWebKit")
      if (m && /^(index|sourcetype|source|eventtype|tag|splunk_server|earliest|latest)$/i.test(m[1])) return;
      if (!m && /^(index|sourcetype|source|eventtype|tag|earliest|latest)$/i.test(t)) return;
      var v = m ? m[3] : t;
      v = v.replace(/^"|"$/g, '').replace(/\*/g, '');
      if (v.length >= 2 && !/^\d{9,}$/.test(v)) out.push(v);
    });
    return out.filter(function (v, i, a) { return a.indexOf(v) === i; }).slice(0, 8);
  }

  function highlight(text, terms) {
    var html = esc(text);
    terms.forEach(function (t) {
      try {
        var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        html = html.replace(re, '<span class="hl">$1</span>');
      } catch (e) {}
    });
    return html;
  }

  /* ---------- table ---------- */
  function renderTable(body, r) {
    var cols = r.fields.filter(function (c) { return c !== '_raw' || !r.isEvents; });
    if (r.isEvents) cols = ['_time'].concat(cols.filter(function (c) { return c !== '_time' && c !== '_raw'; }));
    if (!cols.length) cols = ['_raw'];
    var limit = 1000;
    var tbl = el('table', { class: 'res' });
    var thead = el('thead');
    thead.appendChild(el('tr', {}, cols.map(function (c) { return el('th', { text: c, title: c }); })));
    tbl.appendChild(thead);
    var tb = el('tbody');
    r.rows.slice(0, limit).forEach(function (row) {
      tb.appendChild(el('tr', {}, cols.map(function (c) { return cell(row[c], c); })));
    });
    tbl.appendChild(tb);
    body.appendChild(tbl);
    if (r.rows.length > limit) {
      body.appendChild(el('div', { class: 'empty', style: 'padding:16px',
        text: 'Showing the first ' + limit + ' of ' + fmtInt(r.rows.length) + ' rows.' }));
    }
  }

  function cell(v, colName) {
    if (v === undefined || v === null || v === '') return el('td', {}, [el('span', { class: 'nullv', text: '—' })]);
    if (Array.isArray(v)) {
      return el('td', { class: 'mono' }, v.slice(0, 12).map(function (x) {
        return el('span', { class: 'mv', text: L.toStr(x) });
      }).concat(v.length > 12 ? [el('span', { class: 'mv nullv', text: '+' + (v.length - 12) + ' more' })] : []));
    }
    if (colName === '_time' && typeof v === 'number') {
      return el('td', { class: 'mono', text: L.strftime(v, '%Y-%m-%d %H:%M:%S') });
    }
    var sev = severityOf(colName, v);
    if (sev) return el('td', {}, [el('span', { class: 'pill ' + sev, text: L.toStr(v) })]);
    var n = L.numeric(v);
    if (n !== undefined && typeof v !== 'boolean') {
      var s = Number.isInteger(n) ? fmtInt(n) : String(Math.round(n * 1e6) / 1e6);
      return el('td', { class: 'num', text: s });
    }
    var str = L.toStr(v);
    return el('td', { class: str.length > 60 ? 'mono' : '' , text: str.length > 400 ? str.slice(0, 400) + '…' : str });
  }

  /* Which columns carry state worth colouring, and what the values mean. */
  function severityOf(col, v) {
    if (!col) return null;
    var s = L.toStr(v);
    if (col === 'status' || col === 'http.status' || col === 'code') {
      if (/^2\d\d$/.test(s)) return 'ok';
      if (/^3\d\d$/.test(s)) return 'neutral';
      if (/^4\d\d$/.test(s)) return 'warn';
      if (/^5\d\d$/.test(s)) return 'bad';
      if (s === 'success') return 'ok';
      if (s === 'failure') return 'bad';
      return null;
    }
    if (col === 'level') {
      return s === 'ERROR' ? 'bad' : s === 'WARN' ? 'warn' : s === 'INFO' ? 'ok' : 'neutral';
    }
    if (col === 'action' || col === 'status_type') {
      if (/^(success|allowed|purchase)$/i.test(s)) return 'ok';
      if (/^(failure|blocked|dropped)$/i.test(s)) return 'bad';
      if (/error$/i.test(s)) return s.toLowerCase() === 'server error' ? 'bad' : 'warn';
      if (/^(redirect)$/i.test(s)) return 'neutral';
      return null;
    }
    if (col === 'EventCode') return s === '4625' ? 'bad' : s === '4720' || s === '4732' ? 'warn' : null;
    return null;
  }

  /* ---------- timeline ---------- */
  function drawTimeline(host, rows) {
    var times = rows.map(function (r) { return r._time; }).filter(function (t) { return typeof t === 'number'; });
    if (times.length < 2) return;
    var b = rangeBounds(STATE.range);
    var lo = b.earliest !== null ? b.earliest : Math.min.apply(null, times);
    var hi = b.latest !== null ? b.latest : Math.max.apply(null, times);
    if (hi <= lo) { hi = Math.max.apply(null, times); lo = Math.min.apply(null, times); }
    var N = 60, buckets = new Array(N).fill(0);
    times.forEach(function (t) {
      var i = Math.floor((t - lo) / (hi - lo + 1) * N);
      if (i >= 0 && i < N) buckets[i]++;
    });
    var max = Math.max.apply(null, buckets) || 1;
    var W = 1000, H = 62, pad = 14;
    var bw = (W - 4) / N;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
    buckets.forEach(function (c, i) {
      var h = c === 0 ? 0 : Math.max(1.5, (c / max) * (H - pad - 4));
      svg += '<rect x="' + (2 + i * bw) + '" y="' + (H - pad - h) + '" width="' + (bw - 1.2) +
             '" height="' + h + '" fill="var(--accent)" opacity="' + (c ? .85 : 0) + '"><title>' +
             esc(L.strftime(lo + (hi - lo) * (i / N), '%b %d %H:%M') + ' — ' + c + ' events') + '</title></rect>';
    });
    svg += '<line x1="0" y1="' + (H - pad) + '" x2="' + W + '" y2="' + (H - pad) + '" stroke="var(--border)" stroke-width="1"/>';
    svg += '<text class="tl-label" x="2" y="' + (H - 3) + '">' + esc(L.strftime(lo, '%b %d %H:%M')) + '</text>';
    svg += '<text class="tl-label" x="' + (W - 2) + '" y="' + (H - 3) + '" text-anchor="end">' + esc(L.strftime(hi, '%b %d %H:%M')) + '</text>';
    svg += '<text class="tl-label" x="' + (W / 2) + '" y="' + (H - 3) + '" text-anchor="middle">peak ' + max + ' per bar</text>';
    svg += '</svg>';
    host.innerHTML = svg;
  }

  /* ---------- visualisation ---------- */
  function renderViz(body, r) {
    var spec = chartSpec(r);
    if (!spec) {
      body.appendChild(el('div', { class: 'empty' }, [
        el('h3', { text: 'Nothing to chart yet' }),
        el('div', { text: 'Visualisations need a transforming command. Try piping to stats, chart, timechart, top or rare.' }),
        el('div', { style: 'margin-top:10px;font-family:var(--mono);font-size:12.5px' }, [
          el('a', { href: '#', style: 'color:var(--accent-2)', text: '… | timechart span=1h count',
            onclick: function (e) { e.preventDefault(); setQuery(currentQuery().split('|')[0] + ' | timechart span=1h count'); } })
        ])
      ]));
      return;
    }
    var wrap = el('div', { class: 'viz' });
    var picker = el('div', { class: 'vizpick' });
    [['auto', 'Auto'], ['column', 'Column'], ['line', 'Line'], ['bar', 'Bar']].forEach(function (p) {
      picker.appendChild(el('button', {
        class: STATE.vizType === p[0] ? 'on' : '',
        text: p[1],
        onclick: function () { STATE.vizType = p[0]; renderBody(); }
      }));
    });
    wrap.appendChild(picker);
    var type = STATE.vizType === 'auto' ? (spec.time ? 'column' : (spec.rows.length > 12 ? 'bar' : 'column')) : STATE.vizType;
    wrap.appendChild(drawChart(spec, type));
    var legend = el('div', { class: 'legend' });
    spec.series.forEach(function (s, i) {
      legend.appendChild(el('span', {}, [
        el('i', { style: 'background:' + PALETTE[i % PALETTE.length] }), s
      ]));
    });
    if (spec.series.length > 1) wrap.appendChild(legend);
    body.appendChild(wrap);
  }

  function chartSpec(r) {
    if (r.isEvents) return null;
    var cols = r.fields;
    if (!cols.length) return null;
    if (r.chart) {
      var series = r.chart.series.filter(function (s) {
        return r.rows.some(function (row) { return L.numeric(row[s]) !== undefined; });
      });
      if (!series.length) return null;
      return { x: r.chart.x, series: series, rows: r.rows, time: !!r.chart.time };
    }
    var xCol = cols[0];
    var series = cols.slice(1).filter(function (c) {
      return r.rows.some(function (row) { return L.numeric(row[c]) !== undefined; });
    });
    if (!series.length) return null;
    return { x: xCol, series: series, rows: r.rows.slice(0, 60), time: xCol === '_time' };
  }

  function drawChart(spec, type) {
    var W = 1000, H = 380;
    var padL = 62, padR = 14, padT = 12, padB = spec.time ? 40 : 78;
    if (type === 'bar') { padL = 150; padB = 34; }
    var rows = spec.rows.slice(0, type === 'bar' ? 40 : 400);
    var stacked = spec.series.length > 1 && type === 'column';

    var maxV = 0;
    rows.forEach(function (row) {
      if (stacked) {
        var s = 0;
        spec.series.forEach(function (k) { s += L.numeric(row[k]) || 0; });
        maxV = Math.max(maxV, s);
      } else spec.series.forEach(function (k) { maxV = Math.max(maxV, L.numeric(row[k]) || 0); });
    });
    if (maxV <= 0) maxV = 1;
    var ticks = niceTicks(maxV, 5);
    maxV = ticks[ticks.length - 1];

    var innerW = W - padL - padR, innerH = H - padT - padB;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';

    if (type === 'bar') {
      var bh = innerH / rows.length;
      ticks.forEach(function (t) {
        var x = padL + (t / maxV) * innerW;
        s += line(x, padT, x, padT + innerH, 'var(--border-soft)');
        s += text(x, H - 14, fmtTick(t), 'middle', 11);
      });
      rows.forEach(function (row, i) {
        var y = padT + i * bh;
        var lbl = L.toStr(row[spec.x]);
        s += text(padL - 8, y + bh / 2 + 4, lbl.length > 24 ? lbl.slice(0, 24) + '…' : lbl, 'end', 11);
        var w = ((L.numeric(row[spec.series[0]]) || 0) / maxV) * innerW;
        s += '<rect x="' + padL + '" y="' + (y + bh * .15) + '" width="' + Math.max(0, w) +
             '" height="' + (bh * .7) + '" fill="' + PALETTE[0] + '" rx="2"><title>' +
             esc(lbl + ': ' + L.toStr(row[spec.series[0]])) + '</title></rect>';
      });
      s += line(padL, padT, padL, padT + innerH, 'var(--border)');
      return svgNode(s + '</svg>');
    }

    ticks.forEach(function (t) {
      var y = padT + innerH - (t / maxV) * innerH;
      s += line(padL, y, W - padR, y, 'var(--border-soft)');
      s += text(padL - 8, y + 4, fmtTick(t), 'end', 11);
    });

    var step = innerW / rows.length;
    var labelEvery = Math.ceil(rows.length / (spec.time ? 10 : 18));

    if (type === 'line') {
      spec.series.forEach(function (k, si) {
        var pts = rows.map(function (row, i) {
          var v = L.numeric(row[k]) || 0;
          return [padL + step * (i + .5), padT + innerH - (v / maxV) * innerH];
        });
        // a soft area fill gives a single series some weight without adding noise
        if (spec.series.length === 1 && pts.length > 1) {
          s += '<polygon fill="' + PALETTE[si % PALETTE.length] + '" fill-opacity="0.10" points="' +
               pts[0][0].toFixed(1) + ',' + (padT + innerH) + ' ' +
               pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + ' ' +
               pts[pts.length - 1][0].toFixed(1) + ',' + (padT + innerH) + '"/>';
        }
        s += '<polyline fill="none" stroke="' + PALETTE[si % PALETTE.length] + '" stroke-width="2" ' +
             'stroke-linejoin="round" points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';
        if (rows.length <= 80) pts.forEach(function (p, i) {
          s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.5" fill="' + PALETTE[si % PALETTE.length] + '"><title>' +
               esc(labelOf(rows[i], spec) + '\n' + k + ': ' + L.toStr(rows[i][k])) + '</title></circle>';
        });
      });
    } else {
      rows.forEach(function (row, i) {
        var x0 = padL + step * i;
        var bw = Math.max(1, step * .8);
        var off = 0;
        spec.series.forEach(function (k, si) {
          var v = L.numeric(row[k]) || 0;
          var h = (v / maxV) * innerH;
          if (h <= 0) return;
          if (stacked) {
            s += '<rect x="' + (x0 + step * .1) + '" y="' + (padT + innerH - off - h) + '" width="' + bw +
                 '" height="' + h + '" fill="' + PALETTE[si % PALETTE.length] + '"><title>' +
                 esc(labelOf(row, spec) + '\n' + k + ': ' + L.toStr(row[k])) + '</title></rect>';
            off += h;
          } else {
            var gw = bw / spec.series.length;
            s += '<rect x="' + (x0 + step * .1 + si * gw) + '" y="' + (padT + innerH - h) + '" width="' + Math.max(1, gw - .5) +
                 '" height="' + h + '" fill="' + PALETTE[si % PALETTE.length] + '" rx="1"><title>' +
                 esc(labelOf(row, spec) + '\n' + k + ': ' + L.toStr(row[k])) + '</title></rect>';
          }
        });
      });
    }

    rows.forEach(function (row, i) {
      if (i % labelEvery !== 0) return;
      var x = padL + step * (i + .5);
      var lbl = labelOf(row, spec);
      if (spec.time) s += text(x, H - padB + 18, lbl, 'middle', 10.5);
      else s += '<text x="' + x + '" y="' + (H - padB + 12) + '" transform="rotate(-40 ' + x + ' ' + (H - padB + 12) +
                ')" text-anchor="end" font-size="10.5" fill="var(--text-faint)">' +
                esc(lbl.length > 22 ? lbl.slice(0, 22) + '…' : lbl) + '</text>';
    });
    s += line(padL, padT + innerH, W - padR, padT + innerH, 'var(--border)');
    return svgNode(s + '</svg>');
  }

  function labelOf(row, spec) {
    var v = row[spec.x];
    if (spec.time && typeof v === 'number') {
      var span = spec.rows.length > 1 ? Math.abs(spec.rows[1][spec.x] - spec.rows[0][spec.x]) : 3600;
      return L.strftime(v, span >= 86400 ? '%b %d' : (span >= 3600 ? '%b %d %H:%M' : '%H:%M'));
    }
    return L.toStr(v);
  }
  function line(x1, y1, x2, y2, c) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + c + '" stroke-width="1"/>';
  }
  function text(x, y, t, anchor, size) {
    return '<text x="' + x + '" y="' + y + '" text-anchor="' + anchor + '" font-size="' + size +
           '" fill="var(--text-faint)">' + esc(t) + '</text>';
  }
  function svgNode(html) { var d = el('div'); d.innerHTML = html; return d.firstChild; }
  function niceTicks(max, count) {
    var raw = max / count;
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var norm = raw / mag;
    var stepM = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    var step = stepM * mag;
    var out = [];
    for (var v = 0; v <= max + step * .5; v += step) out.push(Math.round(v * 1e6) / 1e6);
    if (out.length < 2) out.push(step);
    return out;
  }
  function fmtTick(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(n % 1e9 ? 1 : 0) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(n % 1e3 ? 1 : 0) + 'k';
    return String(Math.round(n * 100) / 100);
  }

  function grade(userQuery, ex) {
    var opts = {
      events: DATA.events, lookups: DATA.lookups, geoBlocks: DATA.geoBlocks,
      macros: C.MACROS, earliest: null, latest: null, knownIndexes: DATA.indexes
    };
    var expected, actual;
    try { expected = E.runSearch(ex.solution, opts); }
    catch (e) { return { ok: false, message: 'The reference answer failed to run. Please report this.' }; }
    try { actual = E.runSearch(userQuery, opts); }
    catch (e) { return { ok: false, message: 'Your search did not run: ' + e.message }; }

    if (ex.compare === 'count') {
      if (actual.rows.length === expected.rows.length) {
        return { ok: true, message: 'Correct. ' + fmtInt(actual.rows.length) + ' events, which matches the reference answer.' };
      }
      return { ok: false, message: 'Not quite. Expected ' + fmtInt(expected.rows.length) +
        ' events but your search returned ' + fmtInt(actual.rows.length) + '.' };
    }

    var ecols = expected.fields.filter(function (c) { return c !== '_raw'; });
    var acols = actual.fields.filter(function (c) { return c !== '_raw'; });
    var missing = ecols.filter(function (c) { return acols.indexOf(c) < 0; });
    var extra = acols.filter(function (c) { return ecols.indexOf(c) < 0; });
    if (missing.length || extra.length) {
      var parts = [];
      if (missing.length) parts.push('missing ' + missing.join(', '));
      if (extra.length) parts.push('unexpected ' + extra.join(', '));
      return { ok: false, message: 'The columns do not match: ' + parts.join('; ') +
        '. Expected exactly: ' + ecols.join(', ') + '.' };
    }
    // Column ORDER is only graded where the exercise explicitly asks for it.
    if (ex.strictCols && ecols.join(' ') !== acols.join(' ')) {
      return { ok: false, message: 'Right columns, wrong order. Expected: ' + ecols.join(', ') +
        '. You produced: ' + acols.join(', ') + '.' };
    }
    if (actual.rows.length !== expected.rows.length) {
      return { ok: false, message: 'Expected ' + fmtInt(expected.rows.length) + ' row' +
        (expected.rows.length === 1 ? '' : 's') + ' but got ' + fmtInt(actual.rows.length) + '.' };
    }
    for (var i = 0; i < expected.rows.length; i++) {
      for (var j = 0; j < ecols.length; j++) {
        var c = ecols[j];
        if (normVal(expected.rows[i][c]) !== normVal(actual.rows[i][c])) {
          return { ok: false, message: 'Row ' + (i + 1) + ', column "' + c + '" differs. Expected "' +
            normVal(expected.rows[i][c]) + '" but got "' + normVal(actual.rows[i][c]) + '". Check ordering and filters.' };
        }
      }
    }
    return { ok: true, message: 'Correct. ' + fmtInt(actual.rows.length) + ' row' +
      (actual.rows.length === 1 ? '' : 's') + ' matching the reference answer exactly.' };
  }

  function normVal(v) {
    if (v === undefined || v === null) return '';
    if (Array.isArray(v)) return v.map(normVal).join('');
    var n = L.numeric(v);
    if (n !== undefined && typeof v !== 'boolean') return String(Math.round(n * 1e6) / 1e6);
    return L.toStr(v);
  }

    DATA = window.SPLData.generate();
    DATA.indexes = [];
    DATA.events.forEach(function (e) { if (DATA.indexes.indexOf(e.index) < 0) DATA.indexes.push(e.index); });

    STATE.done = load('done', {});
    STATE.rightTab = load('rightTab', 'reference');

    var hash = readHash();
    STATE.range = hash && hash.t ? hash.t : load('lastRange', '-24h');
    if (!RANGES.some(function (r) { return r.v === STATE.range; })) STATE.range = '-24h';
    $('#timesel').value = STATE.range;
    $('#spl').value = hash ? hash.q : load('lastQuery', 'index=web | stats count by status');

    $('#spl').addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runSearch(); }
    });
    $('#panelbtn').classList.add('on');

    renderRight();
    runSearch();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
